name: Telegram Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "❌ Секрет TELEGRAM_BOT_TOKEN або TELEGRAM_CHAT_ID порожній"; exit 1
          fi
          RESP=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="✅ Тест: GitHub Actions успішно підключено до Telegram. Коли Oracle сервер створиться — прийде повідомлення сюди.")
          if echo "$RESP" | jq -e '.ok' >/dev/null; then
            echo "✅ Повідомлення надіслано"
          else
            echo "❌ Telegram відповів помилкою: $(echo "$RESP" | jq -r '.description')"; exit 1
          fi
